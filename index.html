<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1e2333;
    --muted: #7a8199;
    --accent: #4f6df5;
    --accent-hover: #3d58d6;
    --done: #4caf82;
    --missed: #e6e9f2;
    --border: #e3e7f0;
    --shadow: 0 4px 14px rgba(30, 35, 51, 0.06);
  }

  [data-theme="dark"] {
    --bg: #12141c;
    --card: #1c1f2b;
    --text: #eef0f6;
    --muted: #8890a8;
    --accent: #6c85ff;
    --accent-hover: #8499ff;
    --done: #4caf82;
    --missed: #2a2e3d;
    --border: #2b2f3f;
    --shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
    transition: background 0.25s, color 0.25s;
  }

  .app {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  h1 span { color: var(--accent); }

  #theme-toggle {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.1rem;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s;
  }
  #theme-toggle:hover { transform: scale(1.08); }

  form {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }

  #habit-input {
    flex: 1;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  #habit-input:focus { border-color: var(--accent); }
  #habit-input::placeholder { color: var(--muted); }

  form button {
    padding: 14px 22px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  form button:hover { background: var(--accent-hover); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 48px 16px;
    border: 2px dashed var(--border);
    border-radius: 16px;
    font-size: 0.95rem;
  }

  .habit-card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .habit-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    gap: 12px;
  }

  .habit-name {
    font-size: 1.05rem;
    font-weight: 600;
    word-break: break-word;
  }

  .habit-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .streak {
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 500;
  }
  .streak.active { color: #e8a33d; }

  .delete-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    transition: background 0.15s, color 0.15s;
  }
  .delete-btn:hover { background: #ff5c5c22; color: #ff5c5c; }

  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }

  .day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .day-label {
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 500;
    text-transform: uppercase;
  }

  .day-cell {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 10px;
    background: var(--missed);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    font-size: 1rem;
    transition: transform 0.12s, background 0.2s;
  }
  .day-cell:hover { transform: scale(1.08); }
  .day-cell.done {
    background: var(--done);
    color: #fff;
  }
  .day-cell.today {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  footer {
    text-align: center;
    margin-top: 32px;
    color: var(--muted);
    font-size: 0.82rem;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Habit<span>Track</span></h1>
    <button id="theme-toggle" title="Toggle theme">🌙</button>
  </header>

  <form id="habit-form">
    <input type="text" id="habit-input" placeholder="Add a new habit..." maxlength="40" required>
    <button type="submit">Add</button>
  </form>

  <div id="habits-container"></div>

  <footer>Click the squares to mark a day complete · Data saved in your browser</footer>
</div>

<script>
  // ---------- State ----------
  let habits = JSON.parse(localStorage.getItem('habitTrackerData')) || [];

  // ---------- Helpers ----------
  const DAY_LABELS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

  function dateKey(date) {
    // Returns "YYYY-MM-DD" in local time
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function lastSevenDays() {
    const days = [];
    const today = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      days.push(d);
    }
    return days;
  }

  function calcStreak(history) {
    let streak = 0;
    const today = new Date();
    for (let i = 0; i < 365; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      if (history[dateKey(d)]) {
        streak++;
      } else if (i === 0) {
        // today not done yet — don't break the streak
        continue;
      } else {
        break;
      }
    }
    return streak;
  }

  function save() {
    localStorage.setItem('habitTrackerData', JSON.stringify(habits));
  }

  // ---------- Actions ----------
  function addHabit(name) {
    habits.push({
      id: Date.now(),
      name: name.trim(),
      history: {}
    });
    save();
    render();
  }

  function deleteHabit(id) {
    habits = habits.filter(h => h.id !== id);
    save();
    render();
  }

  function toggleDay(id, key) {
    const habit = habits.find(h => h.id === id);
    if (!habit) return;
    if (habit.history[key]) {
      delete habit.history[key];
    } else {
      habit.history[key] = true;
    }
    save();
    render();
  }

  // ---------- Render ----------
  function render() {
    const container = document.getElementById('habits-container');
    container.innerHTML = '';

    if (habits.length === 0) {
      container.innerHTML =
        '<div class="empty">No habits yet.<br>Add your first habit above to get started 🌱</div>';
      return;
    }

    const days = lastSevenDays();
    const todayKey = dateKey(new Date());

    habits.forEach(habit => {
      const card = document.createElement('div');
      card.className = 'habit-card';

      const streak = calcStreak(habit.history);

      // Top row: name + streak + delete
      const top = document.createElement('div');
      top.className = 'habit-top';

      const name = document.createElement('div');
      name.className = 'habit-name';
      name.textContent = habit.name;

      const meta = document.createElement('div');
      meta.className = 'habit-meta';

      const streakEl = document.createElement('div');
      streakEl.className = 'streak' + (streak > 0 ? ' active' : '');
      streakEl.textContent = streak > 0 ? `🔥 ${streak} day${streak > 1 ? 's' : ''}` : '—';

      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.textContent = '✕';
      del.title = 'Delete habit';
      del.addEventListener('click', () => deleteHabit(habit.id));

      meta.appendChild(streakEl);
      meta.appendChild(del);

      top.appendChild(name);
      top.appendChild(meta);

      // Days grid
      const grid = document.createElement('div');
      grid.className = 'days';

      days.forEach(d => {
        const key = dateKey(d);

        const dayWrap = document.createElement('div');
        dayWrap.className = 'day';

        const label = document.createElement('div');
        label.className = 'day-label';
        label.textContent = DAY_LABELS[d.getDay()];

        const cell = document.createElement('button');
        cell.className = 'day-cell';
        if (habit.history[key]) cell.classList.add('done');
        if (key === todayKey) cell.classList.add('today');
        cell.textContent = '✓';
        cell.title = key;
        cell.addEventListener('click', () => toggleDay(habit.id, key));

        dayWrap.appendChild(label);
        dayWrap.appendChild(cell);
        grid.appendChild(dayWrap);
      });

      card.appendChild(top);
      card.appendChild(grid);
      container.appendChild(card);
    });
  }

  // ---------- Theme ----------
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('habitTrackerTheme', theme);
  }

  // ---------- Init ----------
  document.getElementById('habit-form').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('habit-input');
    if (input.value.trim()) {
      addHabit(input.value);
      input.value = '';
      input.focus();
    }
  });

  document.getElementById('theme-toggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  // Load saved theme
  applyTheme(localStorage.getItem('habitTrackerTheme') || 'light');

  // Initial render
  render();
</script>
</body>
</html>
